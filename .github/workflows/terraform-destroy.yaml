name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_app_repository:       ${{ secrets.APP_REPOSITORY }}
  TF_VAR_terraform_repository: ${{ secrets.TERRAFORM_REPOSITORY }}
  TF_ENV: prod

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Initialize
        id: init
        run: terraform init -input=false -backend-config=environments/${{ env.TF_ENV }}.backend.hcl

      # Modulo novo que deve ser destruivel entra como -target aqui: alvo que nao
      # existe na configuracao vira aviso, nao erro, entao a ausencia passaria
      # despercebida e o recurso sobreviveria ao destroy.
      - name: Terraform Plan Destroy
        id: plan
        run: |
          terraform plan -destroy -input=false -out=tfdestroy.plan \
            -var-file=environments/${{ env.TF_ENV }}.tfvars \
            -target=module.ecs_app \
            -target=module.sg_ecs_tasks \
            -target=module.alb \
            -target=module.sg_alb \
            -target=module.vpc \
            -target=module.ecr \
            -target=module.iam_app

      - name: Terraform Destroy
        id: destroy
        run: terraform apply -input=false -auto-approve tfdestroy.plan