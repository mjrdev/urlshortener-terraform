name: Terraform flow

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - 'environments/**'
      - '.terraform.lock.hcl'
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - 'environments/**'
      - '.terraform.lock.hcl'

  # Escotilha para o problema do ovo e da galinha: quando a mudanca **e** a
  # permissao que o refresh precisa, o plan do run inteiro falha antes de chegar
  # ao apply que corrigiria a role. Com `-target`, o Terraform so atualiza (e so
  # refresca) o modulo indicado, e a permissao nova passa a valer para o run
  # seguinte. Uso tipico: target = module.iam_terraform.
  workflow_dispatch:
    inputs:
      target:
        description: 'Endereco de modulo para -target (vazio = stack inteiro)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

# Configuracao nao sensivel vive em environments/prod.tfvars. Aqui ficam so os
# valores sensitive, que carregam owner id e repo id do GitHub.
env:
  TF_VAR_app_repository:       ${{ secrets.APP_REPOSITORY }}
  TF_VAR_terraform_repository: ${{ secrets.TERRAFORM_REPOSITORY }}
  TF_ENV: prod

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      # `-backend=false` inicializa so os providers e modulos: valida a
      # configuracao sem abrir o state e, principalmente, sem credencial AWS.
      # A role de infraestrutura so e assumivel de refs/heads/main, entao um job
      # de PR que tentasse falar com a AWS falharia sempre — vermelho que nao
      # diz nada sobre o PR.
      - name: Terraform Initialize
        id: init
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

  plan:
    name: Plan & Apply
    runs-on: ubuntu-latest
    needs: validate
    # Plan e apply so na main: os dois precisam do state e da role, que o PR
    # nao tem. Em PR a validacao para no job acima.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Initialize
        id: init
        run: terraform init -input=false -backend-config=environments/${{ env.TF_ENV }}.backend.hcl

      - name: Plan Terraform
        id: plan
        env:
          TARGET: ${{ inputs.target && format('-target={0}', inputs.target) || '' }}
        run: |
          terraform plan -input=false -no-color \
            -var-file=environments/${{ env.TF_ENV }}.tfvars \
            $TARGET -out=tfplan

      # O apply roda no mesmo job de proposito. O plano salvo carrega em texto
      # claro os valores sensitive e os ARNs com o id da conta; em repositorio
      # publico qualquer pessoa baixa os artifacts de um run, entao `tfplan`
      # nunca sai da maquina do runner — passa para o apply pelo filesystem.
      - name: Apply Terraform
        id: apply
        run: terraform apply -input=false -auto-approve tfplan
