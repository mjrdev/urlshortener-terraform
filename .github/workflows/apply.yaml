name: apply

on:
  workflow_run:
    workflows: ["plan"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}